apiVersion: v1
kind: Namespace
metadata:
  labels:
    istio-injection: enabled
  name: bookinfo
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: traces-only
  namespace: bookinfo
spec:
  metrics:
  - overrides:
    - disabled: true
      match:
        metric: ALL_METRICS
    providers:
    - name: prometheus
  tracing:
  - providers:
    - name: otel-tracing
    randomSamplingPercentage: 100
